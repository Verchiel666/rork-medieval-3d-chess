version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint (截至 8.67.x) peer 仅支持 <6.1.0，TypeScript 7 (tsgo)
      # 无稳定编程 API（等 7.1）。生态跟进前忽略 TS 7+ 的升级 PR。
      # 参考 typescript-eslint issue #12518。
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # vitest / @vitest/browser-playwright 在 package.json 中均为精确版本
      # 4.1.11（无 ^），必须成套同步升级；Dependabot 拆成独立 PR 会导致 peer
      # 冲突（vitest-browser-react 2.x 的 peer 历史上限）。vitest 5.0.0 刚发布，
      # 生态刚跟进，暂忽略 major，待稳定后手动成套评估。
      - dependency-name: "vitest"
        versions: [">=5.0.0"]
      - dependency-name: "@vitest/browser-playwright"
        versions: [">=5.0.0"]
      # @types/node 应对齐 CI 运行时 Node 22（engines >=20.19），避免 major
      # 跳级超前运行时（历史：09-08 关 #21、09-11 关 #25 均因 26 超前）。
      - dependency-name: "@types/node"
        versions: [">=23.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
